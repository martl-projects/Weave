# Publishes a GitHub Release for every version tag (made by `npm run release`),
# after the full CI passes, with that version's section of CHANGELOG.md as notes
# and the installers for Windows, macOS and Linux attached, and Weave Server (a
# folder for Node 24, and an image on ghcr.io). The release starts as a draft;
# each build job attaches its own files to it (no Actions artifacts, whose
# storage quota runs out), and it's published once they're all there.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # Its tests fetch the services Weave ships from their repositories (WEAVE_SERVICES_TOKEN).
    secrets: inherit

  # The release as a draft, with its notes: what the build jobs attach their files to.
  draft:
    needs: ci
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The runner has no Node of its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME but package.json says $version"; exit 1; fi
      - name: Notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag " " { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
      - name: Draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Run again: the draft is there already, with what was attached so far (its notes are updated).
        run: node scripts/release-draft.ts draft "$GITHUB_REF_NAME" notes.md

  installers:
    needs: draft
    uses: ./.github/workflows/installers.yml
    with:
      release: ${{ github.ref_name }}
    permissions:
      contents: write
    secrets: inherit

  # Weave Server: the company's node as a folder to run with Node 24 (attached to the release) ...
  server:
    needs: draft
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') }}
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node apps/server/build.ts
      - run: tar -czf "weave-server-$GITHUB_REF_NAME.tgz" -C apps/server/dist .
      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-upload.ts "$GITHUB_REF_NAME" "weave-server-$GITHUB_REF_NAME.tgz"

  # ... and as a container image: ghcr.io/<owner>/weave-server:<version> and :latest.
  server-image:
    needs: ci
    uses: ./.github/workflows/server-image.yml
    permissions:
      contents: read
      packages: write

  # Everything attached: out of draft.
  release:
    needs: [installers, server]
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-draft.ts publish "$GITHUB_REF_NAME"
