# Publishes a GitHub Release for every version tag (made by `npm run release`),
# after the full CI passes, with that version's section of CHANGELOG.md as notes
# and the installers for Windows, macOS and Linux attached, and Weave Server (a
# folder for Node 24, and an image on ghcr.io).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  installers:
    needs: ci
    uses: ./.github/workflows/installers.yml
    secrets: inherit

  # Weave Server: the company's node as a folder to run with Node 24 (attached to the release) ...
  server:
    needs: ci
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node apps/server/build.ts
      - run: tar -czf "weave-server-$GITHUB_REF_NAME.tgz" -C apps/server/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: installers-server
          path: weave-server-*.tgz
          if-no-files-found: error
          # Only for the release job: the release keeps them, and old ones fill the storage quota.
          retention-days: 2

  # ... and as a container image: ghcr.io/<owner>/weave-server:<version> and :latest.
  # On GitHub's runner: the self-hosted Linux runner has no Docker, which would
  # give jobs root there (docs/self-hosted-runners.md).
  server-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/weave-server" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  release:
    needs: [ci, installers, server]
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME but package.json says $version"; exit 1; fi
      - name: Notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag " " { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Weave $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease installers/*
