# Type check, tests and the desktop build on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Windows and Linux run on self-hosted runners (docs/self-hosted-runners.md); set the
    # repository variable WINDOWS_RUNNER or LINUX_RUNNER to "windows-latest" or
    # "ubuntu-latest" to go back to GitHub's.
    # A pull request from a fork always runs on GitHub's: its code is anyone's, and on a self-hosted runner it would run
    # on our own machines. (It gets no secrets either, so it can't fetch the services from private repositories.)
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os || matrix.os == 'windows-latest' && fromJSON(vars.WINDOWS_RUNNER || '["self-hosted","windows-vm"]') || matrix.os == 'ubuntu-latest' && fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') || matrix.os }}
    env:
      # The build bundles the app with esbuild; the Electron binary itself isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Services Weave ships from repositories of their own (packages/shipped/pinned.json): a token that reads them.
      GH_TOKEN: ${{ secrets.WEAVE_SERVICES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      # The phone worker's test talks over a local DHT: alone, so the other files' load doesn't starve its connections.
      - run: npm test -- --exclude apps/mobile/test/worker.test.ts
        timeout-minutes: 30
      - run: npx vitest run apps/mobile/test/worker.test.ts
        timeout-minutes: 10
      - run: npm run build -w @weave/desktop
