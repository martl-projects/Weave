# Builds the desktop installers on each platform. Signed when the repository has
# the secrets (see the top of apps/desktop/package.ts): Windows through Azure
# Trusted Signing, macOS with a Developer ID and notarized; unsigned (Windows) or
# ad-hoc (macOS) otherwise. Called by the release workflow with a tag, each job
# attaches its installers to that release's draft itself (no Actions artifacts,
# whose storage quota runs out); run by hand from the Actions tab to try a build,
# kept as workflow artifacts for two days.
name: Installers

on:
  workflow_call:
    inputs:
      release:
        description: The tag whose release (a draft) gets the installers
        type: string
        required: false
  # By hand too, for one release whose installers didn't all get attached (built from main, so a fixed workflow helps).
  workflow_dispatch:
    inputs:
      release:
        description: The tag whose release (a draft) gets the installers; empty keeps them as workflow artifacts
        type: string
        required: false

# Write: called for a release, each job attaches its installers to the draft.
permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    # All three run on self-hosted runners (docs/self-hosted-runners.md); set the
    # repository variable WINDOWS_RUNNER, MACOS_RUNNER or LINUX_RUNNER to
    # "windows-latest", "macos-latest" or "ubuntu-latest" to go back to GitHub's.
    runs-on: ${{ matrix.os == 'windows-latest' && fromJSON(vars.WINDOWS_RUNNER || '["self-hosted","windows-vm"]') || matrix.os == 'macos-latest' && fromJSON(vars.MACOS_RUNNER || '["self-hosted","macos-mini"]') || matrix.os == 'ubuntu-latest' && fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') || matrix.os }}
    env:
      # electron-builder downloads its own Electron for each target.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # notarytool wants the App Store Connect API key as a file.
      - name: Notarization key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$KEY" ] || exit 0
          printf '%s' "$KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - run: npm run package
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # The services Weave ships from their own repositories (packages/shipped/pinned.json).
          GH_TOKEN: ${{ secrets.WEAVE_SERVICES_TOKEN }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Attach to the release
        if: inputs.release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-upload.ts "${{ inputs.release }}" apps/desktop/release
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.dmg
            apps/desktop/release/*.pkg
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          # Only for the release job: the release keeps them, and old ones fill the storage quota.
          retention-days: 2
