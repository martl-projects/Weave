# Builds the desktop installers on each platform. Signed when the repository has
# the secrets (see the top of apps/desktop/package.ts): Windows through Azure
# Trusted Signing, macOS with a Developer ID and notarized; unsigned (Windows) or
# ad-hoc (macOS) otherwise. Called by the release workflow with a tag, each job
# attaches its installers to that release's draft itself (no Actions artifacts,
# whose storage quota runs out); run by hand from the Actions tab to try a build,
# kept as workflow artifacts for two days.
name: Installers

on:
  workflow_call:
    inputs:
      release:
        description: The tag whose release (a draft) gets the installers
        type: string
        required: false
  # By hand too, for one release whose installers didn't all get attached (built from main, so a fixed workflow helps).
  workflow_dispatch:
    inputs:
      release:
        description: The tag whose release (a draft) gets the installers; empty keeps them as workflow artifacts
        type: string
        required: false
      store:
        description: Build only the Microsoft Store package (.appx), kept as a workflow artifact; with a release tag, also submitted to the Store
        type: boolean
        default: false
      store_identity:
        description: Partner Center, Package/Identity/Name
        type: string
        required: false
      store_publisher:
        description: Partner Center, Package/Identity/Publisher (CN=...)
        type: string
        required: false
      store_publisher_name:
        description: Partner Center, Package/Properties/PublisherDisplayName
        type: string
        required: false
      store_name:
        description: The app's name reserved in Partner Center (the package's DisplayName must be one of them); empty is Weave
        type: string
        required: false

# Write: called for a release, each job attaches its installers to the draft.
permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }}
    if: ${{ !inputs.store }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    # All three run on self-hosted runners (docs/self-hosted-runners.md); set the
    # repository variable WINDOWS_RUNNER, MACOS_RUNNER or LINUX_RUNNER to
    # "windows-latest", "macos-latest" or "ubuntu-latest" to go back to GitHub's.
    runs-on: ${{ matrix.os == 'windows-latest' && fromJSON(vars.WINDOWS_RUNNER || '["self-hosted","windows-vm"]') || matrix.os == 'macos-latest' && fromJSON(vars.MACOS_RUNNER || '["self-hosted","macos-mini"]') || matrix.os == 'ubuntu-latest' && fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') || matrix.os }}
    env:
      # electron-builder downloads its own Electron for each target.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # notarytool wants the App Store Connect API key as a file.
      - name: Notarization key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$KEY" ] || exit 0
          printf '%s' "$KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - run: npm run package
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # The services Weave ships from their own repositories (packages/shipped/pinned.json).
          GH_TOKEN: ${{ secrets.WEAVE_SERVICES_TOKEN }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Attach to the release
        if: inputs.release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-upload.ts "${{ inputs.release }}" apps/desktop/release
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.dmg
            apps/desktop/release/*.pkg
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          # Only for the release job: the release keeps them, and old ones fill the storage quota.
          retention-days: 2

  # The Microsoft Store's package: unsigned, the Store signs it when it's submitted in Partner Center. By hand
  # (store: true) to try one; for a release too once the Store identity is set (repository variables STORE_IDENTITY,
  # STORE_PUBLISHER, STORE_PUBLISHER_NAME, STORE_NAME), and then submitted to Partner Center when its app is set up.
  store:
    name: microsoft-store
    if: ${{ inputs.store || (inputs.release && vars.STORE_IDENTITY) }}
    # GitHub's runner, not the self-hosted one: the package (about 250 MB) goes up to the Store's Azure storage, which
    # the self-hosted runner's upload didn't manage (about 100 KB/s, given up). STORE_RUNNER (JSON) picks another.
    runs-on: ${{ fromJSON(vars.STORE_RUNNER || '"windows-latest"') }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run package -- --store
        env:
          GH_TOKEN: ${{ secrets.WEAVE_SERVICES_TOKEN }}
          WEAVE_STORE_IDENTITY: ${{ inputs.store_identity || vars.STORE_IDENTITY }}
          WEAVE_STORE_PUBLISHER: ${{ inputs.store_publisher || vars.STORE_PUBLISHER }}
          WEAVE_STORE_PUBLISHER_NAME: ${{ inputs.store_publisher_name || vars.STORE_PUBLISHER_NAME }}
          WEAVE_STORE_NAME: ${{ inputs.store_name || vars.STORE_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-microsoft-store
          path: apps/desktop/release/*.appx
          if-no-files-found: error
          retention-days: 2
      # For a release: a new submission in Partner Center with this package, through its Entra app (Manager). Microsoft
      # certifies it, then Windows updates every Store install. Without the secrets the package stays an artifact.
      - uses: microsoft/setup-msstore-cli@v1
        if: ${{ inputs.release }}
      - name: Submit to the Microsoft Store
        if: ${{ inputs.release }}
        # A Store problem mustn't hold the release back: it shows here, and the submission can be redone by hand.
        continue-on-error: true
        shell: pwsh
        env:
          TENANT: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          if (-not $env:CLIENT_SECRET -or -not $env:PRODUCT) { Write-Host "Partner Center isn't set up for this repository: the package stays a workflow artifact"; exit 0 }
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:CLIENT_SECRET
          $package = Get-ChildItem apps/desktop/release/*.appx | Select-Object -First 1
          # The path is the project (msstore finds its publisher there: Electron, from apps/desktop/package.json); -i is
          # the folder the package is in (not the file), where it picks the .appx. A path to the .appx itself finds no
          # publisher.
          msstore publish apps/desktop -i $package.DirectoryName -id $env:PRODUCT
