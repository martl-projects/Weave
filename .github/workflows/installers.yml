# Builds the desktop installers on each platform and keeps them as workflow
# artifacts. Signed when the repository has the secrets (see the top of
# apps/desktop/package.ts): Windows through Azure Trusted Signing, macOS with a
# Developer ID and notarized; unsigned (Windows) or ad-hoc (macOS) otherwise.
# The release workflow attaches them to the GitHub Release; run it by hand from
# the Actions tab to try a build.
name: Installers

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    # All three run on self-hosted runners (docs/self-hosted-runners.md); set the
    # repository variable WINDOWS_RUNNER, MACOS_RUNNER or LINUX_RUNNER to
    # "windows-latest", "macos-latest" or "ubuntu-latest" to go back to GitHub's.
    runs-on: ${{ matrix.os == 'windows-latest' && fromJSON(vars.WINDOWS_RUNNER || '["self-hosted","windows-vm"]') || matrix.os == 'macos-latest' && fromJSON(vars.MACOS_RUNNER || '["self-hosted","macos-mini"]') || matrix.os == 'ubuntu-latest' && fromJSON(vars.LINUX_RUNNER || '["self-hosted","linux-wsl"]') || matrix.os }}
    env:
      # electron-builder downloads its own Electron for each target.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # notarytool wants the App Store Connect API key as a file.
      - name: Notarization key
        if: runner.os == 'macOS'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$KEY" ] || exit 0
          printf '%s' "$KEY" > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - run: npm run package
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.dmg
            apps/desktop/release/*.pkg
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          # Only for the release job: the release keeps them, and old ones fill the storage quota.
          retention-days: 2
