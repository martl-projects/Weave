# Weave Web to Cloudflare Pages (docs/web-stage2.md, step 10): the page from elsewhere than its storage node, built here
# from a tagged commit (web-*) or by hand, and uploaded with a token only this workflow has. The hashes of what it
# uploads are kept as an artifact for the watcher (web-watch.yml).
name: Weave Web

on:
  push:
    tags: ['web-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Services Weave ships from repositories of their own (packages/shipped/pinned.json), and the avatar's renderer.
      GH_TOKEN: ${{ secrets.WEAVE_SERVICES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node packages/shipped/build.ts
      - run: node apps/web/pages.ts https://storage.martl.io
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The project, the first time (it says so when it's there already).
          npx --yes wrangler@4 pages project create weave-web --production-branch=main || true
          npx --yes wrangler@4 pages deploy apps/web/dist/pages --project-name=weave-web --branch=main --commit-dirty=true
      - uses: actions/upload-artifact@v4
        with:
          name: web-hashes
          path: apps/web/dist/pages-hashes.json
          retention-days: 90
