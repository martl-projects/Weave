# Weave Web to Cloudflare Pages (docs/web-stage2.md, step 10): the page from elsewhere than its storage node, built here
# from a tagged commit (web-*) or by hand, and uploaded with a token only this workflow has. The hashes of what it
# uploads are kept as an artifact for the watcher (web-watch.yml).
name: Weave Web

on:
  push:
    tags: ['web-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Services Weave ships from repositories of their own (packages/shipped/pinned.json), and the avatar's renderer.
      GH_TOKEN: ${{ secrets.WEAVE_SERVICES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node packages/shipped/build.ts
      - run: node apps/web/pages.ts https://storage.martl.io
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The project, the first time (it says so when it's there already).
          npx --yes wrangler@4 pages project create weave-web --production-branch=main || true
          # From apps/web, wrangler's root (its package.json), so it takes functions/ there (onboarding links' previews and
          # games' own apps, built by pages.ts) with the page; the page's folder by its whole path.
          cd apps/web && npx --yes wrangler@4 pages deploy "$PWD/dist/pages" --project-name=weave-web --branch=main --commit-dirty=true
          # It must say it took them: a deploy without them serves the bare page at /j/ and /play/.
      # Websites' tabs: a Worker at *.weave-rooms.net (Pages has no wildcard names), with its static files.
      - name: Upload the websites' tabs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config apps/web/rooms-wrangler.toml
      - name: Check the Functions answer
        run: |
          for i in $(seq 30); do
            body=$(curl -fsS https://web.martl.io/play/AAAAAAAA/manifest || true)
            case "$body" in *'"start_url"'*) echo "the Functions answer"; exit 0;; esac
            sleep 10
          done
          echo "web.martl.io/play/.../manifest is not the Functions' answer: were functions/ uploaded?" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        # The hashes are what the watcher compares: kept even when the check above fails.
        if: always()
        with:
          name: web-hashes
          path: |
            apps/web/dist/pages-hashes.json
            apps/web/dist/rooms-hashes.json
          retention-days: 90
