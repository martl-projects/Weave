<!doctype html>
<meta charset="utf-8" />
<style>
  body { margin: 0; font: 12px 'Pixelated MS Sans Serif', Tahoma, Arial, sans-serif; color: #000; background: transparent; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: bold; padding: 3px 6px; border-bottom: 1px solid #808080; }
  td { padding: 3px 6px; border-bottom: 1px solid #dfdfdf; vertical-align: middle; }
  .muted { color: #555; }
  .problem { color: #a00000; }
  a { color: #000080; }
  input, select { font: inherit; }
  button { font: inherit; padding: 2px 8px; background: #c0c0c0; border: 1px solid; border-color: #fff #000 #000 #fff; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .grow { flex: 1; }
  .empty { padding: 6px; color: #555; }
  #picker select { width: 100%; }
</style>
<div id="list" class="empty">Looking for repositories…</div>
<div id="adding" class="row" hidden><span class="grow muted">Linked, a repository gives nobody anything yet: say next to it who here gets access.</span><button id="add">Link a repository…</button></div>
<div id="picker" hidden>
  <div class="row"><input id="filter" class="grow" placeholder="Find a repository its GitHub sign-in reaches" /></div>
  <select id="choice" size="8"></select>
  <div class="row"><span id="picked" class="grow muted"></span><button id="cancel" type="button">Cancel</button><button id="link" disabled>Link</button></div>
</div>
<div id="mine" class="row"></div>
<div id="error" class="problem"></div>
<script>
  // Talks only to Weave: asks the service (its actions, checked by Weave) and shows the answer.
  let view;
  let soon;
  let next = 1;
  let linked = [];
  let reachable;
  const waiting = new Map();
  const act = (name, input) =>
    new Promise((resolve, reject) => {
      const id = next++;
      waiting.set(id, { resolve, reject });
      parent.postMessage({ weave: 'act', id, name, input }, '*');
    });
  const $ = (id) => document.getElementById(id);
  const tall = () => parent.postMessage({ weave: 'height', px: document.body.scrollHeight + 4 }, '*');
  const may = (name) => !!view?.actions.find((a) => a.name === name && a.mine);
  const esc = (text) => String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const failed = (error) => ($('error').textContent = String(error));
  // Who gets access by a link, as one value: none, read (everyone), read:<board>, write.
  const valueOf = (r) => (r.access === 'write' ? 'write' : r.access === 'read' ? (r.board ? `read:${r.board}` : 'read') : 'none');
  const said = (r) => (r.access === 'write' ? 'people picked, to write' : r.access === 'read' ? (r.board ? `readers of ${r.board}` : 'everyone here') : 'nobody: just linked');

  function whoCell(r) {
    if (!may('access')) return `<span class="muted">${esc(said(r))}</span>`;
    const boards = view?.boards ?? [];
    const options = [['none', 'Nobody: just linked'], ['read', 'Everyone here, to read'], ...boards.map((b) => [`read:${b}`, `Readers of ${b}, to read`]), ...(r.access === 'write' ? [['write', 'People picked, to write']] : [])];
    const value = valueOf(r);
    if (!options.some(([v]) => v === value)) options.push([value, said(r)]);
    return `<select data-access="${esc(r.repo)}">${options.map(([v, label]) => `<option value="${esc(v)}"${v === value ? ' selected' : ''}>${esc(label)}</option>`).join('')}</select>`;
  }

  async function show() {
    const list = $('list');
    $('adding').hidden = !may('link') || !$('picker').hidden;
    // Getting access: a GitHub account proven here (Weave asks for it).
    $('mine').innerHTML = `<span class="grow muted">Access goes to members who proved their GitHub account here.</span><button data-account="github">Prove my GitHub account here…</button>`;
    try {
      linked = (await act('repos')).data ?? [];
      if (!linked.length) {
        list.className = 'empty';
        list.textContent = 'No repositories linked here yet.';
      } else {
        list.className = '';
        list.innerHTML = `<table><tr><th>Repository</th><th>Who here gets access</th><th>Given</th><th></th></tr>${linked
          .map((r) => `<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.repo)}</a>${r.problem ? `<div class="problem">${esc(r.problem)}</div>` : ''}</td><td>${whoCell(r)}</td><td class="muted">${r.given ?? 0}</td><td>${may('unlink') ? `<button data-unlink="${esc(r.repo)}">Unlink</button>` : ''}</td></tr>`)
          .join('')}</table>`;
      }
    } catch (error) {
      list.className = 'empty';
      list.textContent = String(error);
    }
    tall();
  }

  // The picker: the repositories its sign-in reaches, those not linked here yet.
  function fill() {
    const here = new Set(linked.map((r) => r.repo.toLowerCase()));
    const find = $('filter').value.trim().toLowerCase();
    const shown = (reachable ?? []).filter((r) => !here.has(r.repo.toLowerCase()) && (!find || r.repo.toLowerCase().includes(find)));
    $('choice').innerHTML = shown.map((r) => `<option value="${esc(r.repo)}">${esc(r.repo)}${r.private ? ' · private' : ''}${r.admin ? '' : ' · not an admin'}</option>`).join('');
    $('picked').textContent = reachable && !shown.length ? (find ? 'None of them is called that.' : 'Every repository it reaches is linked here.') : '';
    $('link').disabled = !$('choice').value;
    tall();
  }
  $('add').addEventListener('click', async () => {
    $('error').textContent = '';
    $('add').disabled = true;
    try {
      reachable = (await act('available')).data ?? [];
      $('picker').hidden = false;
      $('adding').hidden = true;
      fill();
      $('filter').focus();
    } catch (error) {
      failed(error);
    } finally {
      $('add').disabled = false;
      tall();
    }
  });
  $('filter').addEventListener('input', fill);
  $('choice').addEventListener('change', () => {
    const r = reachable?.find((x) => x.repo === $('choice').value);
    $('picked').textContent = r && !r.org ? "A person's repository: GitHub lets its collaborators write, so only people you pick get in." : '';
    $('link').disabled = !$('choice').value;
  });
  $('cancel').addEventListener('click', () => {
    $('picker').hidden = true;
    show();
  });
  $('link').addEventListener('click', async () => {
    $('error').textContent = '';
    $('link').disabled = true;
    try {
      await act('link', { repo: $('choice').value });
      $('picker').hidden = true;
    } catch (error) {
      failed(error);
    }
    show();
  });

  addEventListener('change', async (event) => {
    const repo = event.target?.dataset?.access;
    if (!repo) return;
    const [access, board] = event.target.value.split(/:(.*)/);
    $('error').textContent = '';
    event.target.disabled = true;
    try {
      await act('access', { repo, access, ...(board ? { board } : {}) });
    } catch (error) {
      failed(error);
    }
    show();
  });

  addEventListener('click', async (event) => {
    const platform = event.target?.dataset?.account;
    if (platform) return parent.postMessage({ weave: 'account', platform }, '*');
    const repo = event.target?.dataset?.unlink;
    if (!repo) return;
    event.target.disabled = true;
    try {
      await act('unlink', { repo });
    } catch (error) {
      failed(error);
    } finally {
      show();
    }
  });

  addEventListener('message', (event) => {
    const m = event.data;
    // Each view (again when something changed): show what's current, a moment later if views come in a burst.
    if (m?.weave === 'view') {
      view = m;
      clearTimeout(soon);
      soon = setTimeout(show, 150);
    }
    if (m?.weave === 'acted' && waiting.has(m.id)) {
      const { resolve, reject } = waiting.get(m.id);
      waiting.delete(m.id);
      m.error ? reject(m.error) : resolve(m);
    }
  });
</script>
