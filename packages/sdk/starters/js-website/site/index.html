<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buzzer quiz</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 22px; }
      .question { font-size: 20px; margin: 16px 0; min-height: 1.4em; }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid currentColor; cursor: pointer; }
      #buzz { font-size: 28px; width: 100%; padding: 32px; background: #e2483d; color: white; border: none; }
      #buzz:disabled { opacity: 0.4; cursor: default; }
      .row { display: flex; gap: 8px; margin: 8px 0; }
      .row input { flex: 1; font: inherit; padding: 8px; }
      .muted { opacity: 0.7; font-size: 14px; }
      li b { float: right; }
    </style>
  </head>
  <body>
    <h1>Buzzer quiz</h1>
    <p class="muted" id="who">Connecting…</p>
    <div class="question" id="question"></div>
    <p class="muted" id="status"></p>
    <div id="host" hidden>
      <div class="row"><input id="ask" placeholder="Ask a question…" /><button id="send">Ask</button></div>
      <div class="row"><button id="right">Right</button><button id="wrong">Wrong</button></div>
    </div>
    <button id="buzz" hidden disabled>Buzz!</button>
    <h2>Scores</h2>
    <ol id="scores"></ol>
    <p class="muted" id="players"></p>
    <script src="app.js"></script>
  </body>
</html>
