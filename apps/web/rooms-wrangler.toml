# The Cloudflare Worker in front of websites' tabs, *.weave-rooms.net (rooms-worker.ts, docs/web-stage2.md, step 9).
# Built by pages.ts into dist/, uploaded by the Weave Web workflow.
name = "weave-rooms"
main = "dist/rooms-worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [{ pattern = "*.weave-rooms.net/*", zone_name = "weave-rooms.net" }]

[assets]
directory = "dist/rooms"
binding = "ASSETS"
run_worker_first = true
