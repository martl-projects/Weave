<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View</title>
  </head>
  <body>
    <!--
      A lens's or a widget's view in Weave Web (docs/web-stage2.md, step 8). Weave Web has nowhere to serve a view's files
      from, so this page, served sandboxed (its own CSP: an origin of its own, scripts, no network, no forms), asks the
      page for them ({weave: 'files', net}), gets them ({weave: 'files', files: [{path, type, data}]}), and builds the view's
      page from them: each file a blob: address here, its index.html written in place of this one. From then on the view
      talks to Weave as anywhere (apps/desktop/src/renderer/lens.tsx), and says {weave: 'loaded'} once it has.
    -->
    <script>
      (function () {
        'use strict';
        var asked = false;
        function bytes(base64) {
          var text = atob(base64);
          var out = new Uint8Array(text.length);
          for (var i = 0; i < text.length; i++) out[i] = text.charCodeAt(i);
          return out;
        }
        /** A path inside the view, from an address written in `from` (a file's path): undefined for one elsewhere. */
        function inside(address, from) {
          if (!address || /^[a-z][a-z0-9+.-]*:|^\/\/|^#/i.test(address)) return undefined;
          var path = address.split(/[?#]/)[0];
          var parts = path.charAt(0) === '/' ? [] : from.split('/').slice(0, -1);
          path.split('/').forEach(function (part) {
            if (part === '..') parts.pop();
            else if (part && part !== '.') parts.push(part);
          });
          return parts.join('/');
        }
        function build(files, log) {
          var byPath = {};
          files.forEach(function (f) {
            byPath[f.path] = f;
          });
          var urls = {};
          // Style sheets first: their url(…)s point at the other files' blob addresses.
          function url(path) {
            if (urls[path]) return urls[path];
            var f = byPath[path];
            if (!f) return undefined;
            var data = bytes(f.data);
            if (/^text\/css/.test(f.type)) {
              var css = new TextDecoder().decode(data).replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, function (all, quote, address) {
                var found = url(inside(address, path) || '');
                return found ? 'url(' + quote + found + quote + ')' : all;
              });
              data = new TextEncoder().encode(css);
            }
            urls[path] = URL.createObjectURL(new Blob([data], { type: f.type }));
            return urls[path];
          }
          var index = byPath['index.html'];
          if (!index) throw new Error('the view has no index.html');
          var doc = new DOMParser().parseFromString(new TextDecoder().decode(bytes(index.data)), 'text/html');
          doc.querySelectorAll('[src], link[href]').forEach(function (el) {
            var attr = el.hasAttribute('src') ? 'src' : 'href';
            var found = url(inside(el.getAttribute(attr), 'index.html') || '');
            if (found) el.setAttribute(attr, found);
          });
          // Before anything of the view runs: what goes wrong in it is said to Weave, which keeps it where its person
          // turned that on (diagnose.ts). Nobody sees a phone's console.
          var tell = doc.createElement('script');
          tell.textContent =
            "(function(){function say(text){try{parent.postMessage({weave:'log',level:'error',text:String(text).slice(0,2000)},'*')}catch(e){}}" +
            "addEventListener('error',function(e){say((e.message||'error')+' at '+(e.filename||'')+':'+e.lineno+':'+e.colno+(e.error&&e.error.stack?' '+e.error.stack:''))});" +
            "addEventListener('unhandledrejection',function(e){var r=e.reason;say('unhandled rejection: '+(r&&(r.stack||r.message)||r))});" +
            // Where its person has this browser write down what is said: the view's console, and what held its page up
            // (tasks of 200 ms and more, where the browser tells). A few hundred lines at most: a view that logs every
            // frame must not push everything else out.
            (log
              ? "var left=300;function line(level,text){if(left-->0)try{parent.postMessage({weave:'log',level:level,text:String(text).slice(0,2000)},'*')}catch(e){}}" +
                "function text(a){try{return a instanceof Error?(a.stack||a.message):typeof a==='string'?a:JSON.stringify(a)}catch(e){return String(a)}}" +
                "['log','info','warn','error'].forEach(function(level){var said=console[level];console[level]=function(){said.apply(console,arguments);line(level==='log'?'info':level,Array.prototype.map.call(arguments,text).join(' '))}});" +
                "try{new PerformanceObserver(function(list){list.getEntries().forEach(function(e){if(e.duration>=200)line('warn','the view was held up for '+Math.round(e.duration)+' ms, '+Math.round(e.startTime)+' ms after it opened')})}).observe({type:'longtask',buffered:true})}catch(e){}" +
                "addEventListener('load',function(){line('info','the view loaded '+Math.round(performance.now())+' ms after it opened')});" +
                // How many pixels the view holds: its canvases (those not on the page too, and OffscreenCanvas), the
                // bitmaps it made and the pictures on its page, at four bytes a pixel. A phone ends a page whose
                // canvases take too much (Safari: about 384 MB together) without a word. Said when it changed by a
                // tenth (8 MB at least), looked at every 0.7 s (a page may live ten seconds); the last line before a page ended says
                // how much there was.
                "var live=[];function track(c){if(typeof WeakRef==='function')live.push(new WeakRef(c));return c}" +
                "var make=document.createElement;document.createElement=function(tag){var el=make.apply(document,arguments);if(String(tag).toLowerCase()==='canvas')track(el);return el};" +
                "var Off=window.OffscreenCanvas;if(Off){window.OffscreenCanvas=function(w,h){return track(new Off(w,h))};window.OffscreenCanvas.prototype=Off.prototype}" +
                "var bitmap=window.createImageBitmap;if(bitmap){window.createImageBitmap=function(){return bitmap.apply(window,arguments).then(track)}}" +
                "var saidMB=-1,reports=200;function mb(px){return Math.round(px*4/1e6)}" +
                "function count(){var seen=[],n=0,px=0,sizes={},area={},bn=0,bpx=0,im=0,ipx=0;" +
                "Array.prototype.forEach.call(document.querySelectorAll('canvas'),function(c){seen.push(c)});" +
                "live=live.filter(function(r){var c=r.deref();if(!c)return false;if(seen.indexOf(c)<0)seen.push(c);return true});" +
                "seen.forEach(function(c){var p=c.width*c.height;if(!p)return;if(typeof c.close==='function'&&!c.getContext){bn++;bpx+=p}else{n++;px+=p;var k=c.width+'x'+c.height;sizes[k]=(sizes[k]||0)+1;area[k]=p}});" +
                // Which sizes, and how many of each: the six that take most, so one can tell a stage from thumbnails.
                "var bigAt=Object.keys(sizes).sort(function(a,b){return area[b]*sizes[b]-area[a]*sizes[a]}).slice(0,6).map(function(k){return sizes[k]+' of '+k}).join(', ');" +
                "Array.prototype.forEach.call(document.images||[],function(i){if(i.complete&&i.naturalWidth){im++;ipx+=i.naturalWidth*i.naturalHeight}});" +
                "var all=mb(px+bpx+ipx);if(reports>0&&(saidMB<0||Math.abs(all-saidMB)>=Math.max(8,saidMB*0.1))){reports--;saidMB=all;" +
                "try{parent.postMessage({weave:'log',level:'info',text:'the view holds about '+all+' MB of pixels: '+n+' canvases '+mb(px)+' MB'+(bigAt?' ('+bigAt+')':'')+', '+bn+' bitmaps '+mb(bpx)+' MB, '+im+' pictures '+mb(ipx)+' MB'},'*')}catch(e){}}}" +
                "setInterval(count,700);" +
                // Where the view's time goes, and how smoothly it draws (frameMeter in diagnose.ts, the same counting). No
                // browser on a phone tells which script is slow, so the frame times what it can: how long the view's own
                // frame callbacks and timers ran, and how long the calls took that are dear in Safari (reading a canvas
                // back, turning one into a picture, WebGL's set-up). Said every five seconds when it was bad: fewer than
                // 40 frames a second, a pause of 200 ms and more, or a second and more of scripts. 150 lines at most.
                "var raf=requestAnimationFrame,cost={},calls={};function add(k,ms){cost[k]=(cost[k]||0)+ms;calls[k]=(calls[k]||0)+1}" +
                "function timed(o,name,k){var f=o&&o[name];if(typeof f!=='function')return;o[name]=function(){var t=performance.now();try{return f.apply(this,arguments)}finally{add(k,performance.now()-t)}}}" +
                "function proto(n){return window[n]&&window[n].prototype}" +
                "['CanvasRenderingContext2D','OffscreenCanvasRenderingContext2D'].forEach(function(n){['getImageData','putImageData','drawImage'].forEach(function(m){timed(proto(n),m,m)})});" +
                "['toDataURL','toBlob','getContext'].forEach(function(m){timed(proto('HTMLCanvasElement'),m,m)});" +
                "['convertToBlob','transferToImageBitmap','getContext'].forEach(function(m){timed(proto('OffscreenCanvas'),m,m)});" +
                "['WebGL2RenderingContext','WebGLRenderingContext'].forEach(function(n){['readPixels','texImage2D','texSubImage2D','compileShader','linkProgram','drawArrays','drawElements'].forEach(function(m){timed(proto(n),m,'gl.'+m)})});" +
                "function calling(k,cb){return typeof cb!=='function'?cb:function(){var t=performance.now();try{return cb.apply(this,arguments)}finally{add(k,performance.now()-t)}}}" +
                "if(window.requestAnimationFrame)window.requestAnimationFrame=function(cb){return raf.call(window,calling('frame callbacks',cb))};" +
                "['setTimeout','setInterval'].forEach(function(n){var f=window[n];if(typeof f==='function')window[n]=function(cb){var a=Array.prototype.slice.call(arguments);a[0]=calling('timers',cb);return f.apply(window,a)}});" +
                "var fb,fl=0,fn=0,fx=0,fp=0,fr=150;function frame(now){raf.call(window,frame);" +
                "if(fb===undefined||now-fl>4000){fb=now;fl=now;fn=0;fx=0;fp=0;cost={};calls={};return}" +
                "var gap=now-fl;fl=now;fn++;if(gap>fx)fx=gap;if(gap>=100)fp++;if(now-fb<5000)return;" +
                "var fps=Math.round(fn*1000/(now-fb)),scripts=(cost['frame callbacks']||0)+(cost.timers||0);if(fr>0&&(fps<40||fx>=200||scripts>=1000)){fr--;" +
                "var where=Object.keys(cost).filter(function(k){return cost[k]>=20}).sort(function(a,b){return cost[b]-cost[a]}).slice(0,9).map(function(k){return k+' '+Math.round(cost[k])+' ms ('+calls[k]+')'}).join(', ');" +
                "try{parent.postMessage({weave:'log',level:'warn',text:'the view drew '+fps+' frames a second over '+Math.round((now-fb)/1000)+' s, the longest pause '+Math.round(fx)+' ms, '+fp+' of 100 ms and more'+(where?'; in it: '+where:'')},'*')}catch(e){}}" +
                "fb=now;fn=0;fx=0;fp=0;cost={};calls={}}" +
                "raf.call(window,frame);"
              : '') +
            '})();';
          doc.head.insertBefore(tell, doc.head.firstChild);
          // After everything the view's page runs as it loads: it listens now.
          var done = doc.createElement('script');
          done.textContent = "parent.postMessage({ weave: 'loaded' }, '*');";
          doc.body.appendChild(done);
          document.open();
          document.write('<!doctype html>' + doc.documentElement.outerHTML);
          document.close();
        }
        window.addEventListener('message', function (event) {
          if (event.source !== window.parent || asked || !event.data || event.data.weave !== 'files' || !Array.isArray(event.data.files)) return;
          asked = true;
          try {
            build(event.data.files, event.data.log === true);
          } catch (error) {
            document.body.textContent = String((error && error.message) || error);
          }
        });
        // The hosts in this frame's own address, which its CSP took (functions/lens-frame.ts): the page sends the files
        // only if they're the ones it allowed, so a view that sent its frame elsewhere gets nothing.
        window.parent.postMessage({ weave: 'files', net: new URLSearchParams(location.search).get('net') || '' }, '*');
      })();
    </script>
  </body>
</html>
